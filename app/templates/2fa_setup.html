{% extends 'base.html' %}
{% block content %}
<h2>📱 Two-Factor Setup</h2>
<p>Scan this QR code with your authenticator app (e.g., Google Authenticator):</p>
<img src="https://api.qrserver.com/v1/create-qr-code/?data={{ otp_uri|urlencode }}&amp;size=200x200" alt="2FA QR Code">
<p>Or manually enter this code: <strong>{{ secret }}</strong></p>
<a href="{{ url_for('two_factor_verify') }}" class="api-link" style="margin-top: 20px; display: inline-block;">Continue to 2FA Verification</a>
{% endblock %}
