{% extends 'base.html' %}
{% block content %}
<h2>🔐 2FA Verification</h2>
<p>Please enter the 6-digit code from your authenticator app:</p>
<form method="POST">
    <input type="text" name="token" required pattern="\d{6}" placeholder="123456" style="padding: 10px; font-size: 16px; margin-top: 10px;">
    <br><br>
    <button type="submit">Verify</button>
</form>
{% endblock %}
